plugins { id 'com.android.application' }
android {
    namespace 'com.local.signingdisplay'
    compileSdk { version = release(37) { minorApiLevel = 2 } }
    defaultConfig {
        applicationId 'com.local.signingdisplay'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
        ndk { abiFilters 'armeabi-v7a' }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'org.mozilla.geckoview:geckoview:160.0.20261104181552' }
